name: publish-registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify server.json matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const versions = [pkg.version, srv.version, ...srv.packages.map((p) => p.version)];
            if (new Set(versions).size !== 1) {
              console.error("version mismatch:", versions);
              process.exit(1);
            }
            console.log("publishing", pkg.version);
          '
      - name: Wait for npm package version
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          for _ in $(seq 1 30); do
            if npm view "@orderly.network/mcp-server@${VERSION}" version >/dev/null 2>&1; then
              echo "npm has ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "npm does not have ${VERSION} after 5 minutes" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher version
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: ./mcp-publisher publish
